services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-key}
      - FLASK_DEBUG=0
      - FLASK_APP=app.py
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        # Браузер с хоста должен стучаться в backend через проброшенный порт
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  backend-data:
  postgres-data:
