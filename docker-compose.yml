services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-key}
      - FLASK_DEBUG=0
      - FLASK_APP=app.py
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_BUCKET=processed
      - MINIO_SECURE=false
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio

  frontend:
    build:
      context: ./frontend
      args:
        # Браузер с хоста должен стучаться в backend через проброшенный порт
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minio minio123; do sleep 1; done; mc mb -p local/processed || true"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  backend-data:
  postgres-data:
  minio-data:
